<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeriQC Edge Station</title>
<style>
  :root { color-scheme: dark; --bg:#0a0f1c; --panel:#111827; --line:#1f2937; --text:#e5e7eb; --muted:#94a3b8; --pass:#34d399; --fail:#f87171; --review:#fbbf24; --accent:#60a5fa; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  header { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid var(--line); background:#0d1424; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  header .spacer { flex:1; }
  header select, header button, input, button { background:#0b1220; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:7px 9px; font:inherit; }
  button { cursor:pointer; }
  button.primary { border-color:var(--accent); color:#dbeafe; }
  button.danger { border-color:var(--fail); color:#fecaca; }
  main { display:grid; grid-template-columns: minmax(0,1.55fr) minmax(340px,.9fr); gap:14px; padding:16px 20px 40px; }
  section { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:13px; }
  h2 { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 9px; }
  .verdict { font-size:42px; font-weight:800; letter-spacing:.04em; padding:8px 0 2px; }
  .pass { color:var(--pass); } .fail { color:var(--fail); } .review { color:var(--review); }
  .muted { color:var(--muted); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .images { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px; }
  .imagebox { background:#050914; border:1px solid var(--line); border-radius:8px; min-height:220px; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .imagebox img { max-width:100%; max-height:440px; display:block; }
  .imagebox .tag { position:absolute; left:8px; top:8px; background:#000a; padding:2px 7px; border-radius:4px; font-size:10px; color:var(--muted); }
  table { width:100%; border-collapse:collapse; margin-top:5px; }
  th, td { text-align:left; padding:6px 7px; border-bottom:1px solid var(--line); font-size:12px; }
  th { color:var(--muted); font-weight:600; }
  .advice { white-space:pre-wrap; line-height:1.5; font-size:14px; }
  .chips { display:flex; gap:5px; flex-wrap:wrap; margin:7px 0; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:2px 8px; font-size:10px; color:var(--muted); }
  .metric { display:grid; grid-template-columns:1fr auto; gap:4px 12px; font-size:12px; }
  .metric div:nth-child(odd) { color:var(--muted); }
  .history tr { cursor:pointer; }
  .history tr:hover td { background:#0b1220; }
  .ok { color:var(--pass); } .bad { color:var(--fail); }
  .sourcebar { display:grid; grid-template-columns: 110px 1fr auto auto; gap:7px; align-items:center; }
  .sourcebar input { min-width:80px; }
  .small { font-size:11px; }
  @media (max-width: 1000px) { main { grid-template-columns:1fr; } .images { grid-template-columns:1fr; } .sourcebar { grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<header>
  <h1>VeriQC <span class="muted">| edge inspection</span></h1>
  <select id="profile" aria-label="profile"></select>
  <button id="activate">activate</button>
  <span class="spacer"></span>
  <button id="alarm" class="small">enable alert</button>
  <span id="chain" class="muted small">chain: --</span>
  <span id="device" class="muted small">device: --</span>
</header>
<main>
  <div>
    <section>
      <div class="row">
        <div>
          <h2>verdict</h2>
          <div id="verdict" class="verdict muted">STANDBY</div>
          <div id="part" class="muted">waiting for a part</div>
        </div>
        <span class="spacer" style="flex:1"></span>
        <div class="row">
          <input id="part-id" value="PART-0001" aria-label="part id" style="width:140px">
          <button class="primary" id="capture">capture</button>
          <label class="small muted"><input id="auto" type="checkbox"> auto</label>
          <input id="interval" type="number" min="1" max="60" value="3" style="width:62px" aria-label="auto interval seconds">
          <span class="small muted">s</span>
        </div>
      </div>
      <div class="chips" id="chips"></div>
      <div class="images">
        <div class="imagebox"><span class="tag">LIVE</span><img id="live" alt="" style="display:none"></div>
        <div class="imagebox"><span class="tag">RESULT</span><img id="overlay" alt="" style="display:none"></div>
      </div>
      <div class="sourcebar" style="margin-top:10px">
        <select id="source-type">
          <option value="folder">folder</option>
          <option value="video">video</option>
          <option value="camera">camera</option>
        </select>
        <input id="source-path" placeholder="folder or video path (camera: index)">
        <button id="source-start" class="primary">start source</button>
        <button id="source-stop" class="danger">stop</button>
      </div>
      <div class="row" style="margin-top:8px">
        <input id="file" type="file" accept="image/*" aria-label="image">
        <button id="inspect">inspect upload</button>
        <span id="source-status" class="muted small">source: stopped</span>
      </div>
    </section>
    <section style="margin-top:14px">
      <h2>findings</h2>
      <table><thead><tr><th>source</th><th>class</th><th>confidence</th><th>score</th><th>area %</th><th>zone</th><th>severity</th></tr></thead><tbody id="findings"></tbody></table>
    </section>
    <section style="margin-top:14px">
      <h2>audit history</h2>
      <table class="history"><thead><tr><th>id</th><th>part</th><th>verdict</th><th>event</th></tr></thead><tbody id="history"></tbody></table>
      <div class="row" style="margin-top:9px"><a id="export" href="/export.csv" class="muted small">export csv</a></div>
    </section>
  </div>
  <div>
    <section>
      <h2>on-device advisory</h2>
      <div id="advisory" class="advice muted">no advisory requested</div>
      <div class="chips" id="advisory-meta"></div>
      <div class="row" id="review-actions" style="display:none; margin-top:9px">
        <button id="review-pass">confirm pass</button>
        <button id="review-fail" class="danger">confirm fail</button>
      </div>
    </section>
    <section style="margin-top:14px">
      <h2>station</h2>
      <div class="metric" id="metrics"></div>
    </section>
    <section style="margin-top:14px">
      <h2>runtime separation</h2>
      <div class="advice muted" id="runtime"></div>
    </section>
  </div>
</main>
<script>
const TOKEN = new URLSearchParams(location.search).get("token") || "";
const headers = () => TOKEN ? {"X-VeriQC-Token": TOKEN} : {};
let currentId = null;
let autoTimer = null;
let busy = false;
let audioCtx = null;
let alertEnabled = false;

function setText(id, value) {
  const node = document.getElementById(id);
  node.textContent = value === null || value === undefined ? "--" : String(value);
}
function assetUrl(path) {
  const params = new URLSearchParams();
  if (TOKEN) params.set("token", TOKEN);
  params.set("t", Date.now());
  return path + "?" + params.toString();
}
function cell(row, value) {
  const td = document.createElement("td");
  td.textContent = value === null || value === undefined ? "--" : String(value);
  row.appendChild(td);
}
function beep(kind) {
  if (!alertEnabled || !audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "sine";
  osc.frequency.value = kind === "FAIL" ? 880 : 520;
  gain.gain.value = 0.06;
  osc.connect(gain); gain.connect(audioCtx.destination);
  osc.start(); osc.stop(audioCtx.currentTime + (kind === "FAIL" ? 0.35 : 0.18));
}
function render(result) {
  currentId = result.inspection_id;
  const verdict = document.getElementById("verdict");
  verdict.textContent = result.verdict;
  verdict.className = "verdict " + (result.verdict === "PASS" ? "pass" : result.verdict === "FAIL" ? "fail" : "review");
  setText("part", (result.part_id || "--") + " | " + (result.latency_ms?.total_ms ?? "--") + " ms");
  const overlay = document.getElementById("overlay");
  if (result.overlay) {
    overlay.src = assetUrl("/overlay/" + result.inspection_id);
    overlay.style.display = "block";
  } else { overlay.style.display = "none"; }
  const findings = document.getElementById("findings");
  findings.textContent = "";
  for (const f of result.findings || []) {
    const tr = document.createElement("tr");
    cell(tr, f.source); cell(tr, f.defect_class); cell(tr, f.confidence); cell(tr, f.score);
    cell(tr, f.area_ratio === null || f.area_ratio === undefined ? "--" : (100 * f.area_ratio).toFixed(3));
    cell(tr, f.zone); cell(tr, f.severity);
    findings.appendChild(tr);
  }
  const chips = document.getElementById("chips");
  chips.textContent = "";
  for (const [key, value] of Object.entries(result.thresholds || {})) {
    const span = document.createElement("span"); span.className = "chip"; span.textContent = key + "=" + value; chips.appendChild(span);
  }
  if (result.anomaly_p_value !== null && result.anomaly_p_value !== undefined) {
    const span = document.createElement("span"); span.className = "chip"; span.textContent = "anomaly p=" + Number(result.anomaly_p_value).toFixed(4); chips.appendChild(span);
  }
  if (result.decision_rule) {
    const span = document.createElement("span"); span.className = "chip"; span.textContent = result.decision_rule; chips.appendChild(span);
  }
  const adv = result.advisory || {};
  setText("advisory", adv.text || (result.verdict === "PASS" ? "Part accepted." : "no advisory"));
  const meta = document.getElementById("advisory-meta");
  meta.textContent = "";
  for (const text of [adv.status, adv.accepted ? "verified model" : "template floor", adv.latency_ms ? Math.round(adv.latency_ms) + " ms" : null]) {
    if (!text) continue;
    const span = document.createElement("span"); span.className = "chip"; span.textContent = text; meta.appendChild(span);
  }
  document.getElementById("review-actions").style.display = (result.verdict === "REVIEW" || result.verdict === "FAIL") ? "flex" : "none";
  if (result.verdict !== "PASS") beep(result.verdict);
  fetchHistory();
}
async function inspectUpload() {
  const file = document.getElementById("file").files[0];
  if (!file) { setText("advisory", "select an image first"); return; }
  const part = document.getElementById("part-id").value || "PART-0001";
  const form = new FormData(); form.append("file", file); form.append("part_id", part);
  const response = await fetch("/inspect", {method:"POST", body:form, headers:headers()});
  if (!response.ok) { setText("advisory", "inspection failed: " + await response.text()); return; }
  render(await response.json());
}
async function capture() {
  if (busy) return;
  busy = true;
  try {
    const part = document.getElementById("part-id").value || "PART-0001";
    const form = new FormData(); form.append("part_id", part);
    const response = await fetch("/capture", {method:"POST", body:form, headers:headers()});
    if (!response.ok) { setText("advisory", "capture failed: " + await response.text()); return; }
    render(await response.json());
  } finally { busy = false; }
}
async function startSource() {
  const type = document.getElementById("source-type").value;
  const path = document.getElementById("source-path").value.trim();
  const payload = {type};
  if (type === "folder" || type === "video") payload.path = path;
  if (type === "camera") payload.camera = {kind: "usb", index: Number(path || 0)};
  const response = await fetch("/source/start", {method:"POST", headers:{...headers(), "Content-Type":"application/json"}, body:JSON.stringify(payload)});
  if (!response.ok) { setText("source-status", "source failed: " + await response.text()); return; }
  const status = await response.json();
  setText("source-status", "source: running (" + (status.frames_captured || 0) + " frames)");
  const live = document.getElementById("live");
  live.src = assetUrl("/stream.mjpg");
  live.style.display = "block";
  fetchMetrics();
}
async function stopSource() {
  await fetch("/source/stop", {method:"POST", headers:headers()});
  document.getElementById("live").style.display = "none";
  setText("source-status", "source: stopped");
  fetchMetrics();
}
async function fetchHistory() {
  const response = await fetch("/history?limit=12", {headers:headers()});
  const data = await response.json();
  setText("chain", "chain: " + (data.integrity_ok ? "verified" : "BROKEN"));
  const body = document.getElementById("history"); body.textContent = "";
  for (const row of data.entries || []) {
    const tr = document.createElement("tr");
    cell(tr, row.id); cell(tr, row.part_id); cell(tr, row.verdict); cell(tr, row.event);
    tr.onclick = async () => {
      const r = await fetch("/result/" + row.inspection_id, {headers:headers()});
      if (r.ok) render(await r.json());
    };
    body.appendChild(tr);
  }
}
async function fetchMetrics() {
  const response = await fetch("/metrics", {headers:headers()});
  const data = await response.json();
  setText("device", "device: " + (data.device || "--") + " / " + (data.backend || "--"));
  const box = document.getElementById("metrics"); box.textContent = "";
  const entries = {
    profile: data.profile_id, domain: data.domain, task: data.task,
    advisory: data.advisory?.available ? "available" : "unavailable",
    queue: data.advisory?.queue, inspections: data.stats?.inspections,
    capture: data.capture?.running ? "running" : "stopped",
    frames: data.capture?.frames_captured,
    chain_rows: data.chain?.rows, chain_ok: data.chain?.ok,
  };
  for (const [key, value] of Object.entries(entries)) {
    const k = document.createElement("div"); k.textContent = key;
    const v = document.createElement("div"); v.textContent = value === true ? "yes" : value === false ? "no" : value ?? "--";
    box.appendChild(k); box.appendChild(v);
  }
  setText("runtime", "Vision: ONNX Runtime CPU unless a profile explicitly selects PyTorch. Advisory: Built with Llama. Llama 3.2 1B Instruct runs via ExecuTorch in an isolated child process. The advisory cannot change the verdict; the template is the floor.");
  if (data.capture?.running) {
    setText("source-status", "source: running (" + (data.capture.frames_captured || 0) + " frames)");
    const live = document.getElementById("live");
    if (!live.src) {
      live.src = assetUrl("/stream.mjpg");
      live.style.display = "block";
    }
  }
}
async function fetchProfiles() {
  const response = await fetch("/profiles", {headers:headers()});
  const data = await response.json();
  const select = document.getElementById("profile"); select.textContent = "";
  for (const p of data.profiles || []) {
    const option = document.createElement("option"); option.value = p.id;
    option.textContent = p.domain + " / " + p.id; option.selected = p.id === data.active;
    select.appendChild(option);
  }
}
async function activate() {
  const id = document.getElementById("profile").value;
  const response = await fetch("/profiles/" + id + "/activate", {method:"POST", headers:headers()});
  if (!response.ok) { setText("advisory", "profile activation failed: " + await response.text()); return; }
  currentId = null; fetchMetrics(); fetchHistory(); stopSource();
}
async function review(label) {
  if (!currentId) return;
  await fetch("/review/" + currentId, {method:"POST", headers:{...headers(), "Content-Type":"application/json"}, body:JSON.stringify({label, note:"operator confirmation"})});
  fetchHistory();
}
function autoChanged() {
  if (autoTimer) { clearInterval(autoTimer); autoTimer = null; }
  if (document.getElementById("auto").checked) {
    const seconds = Math.max(1, Number(document.getElementById("interval").value || 3));
    autoTimer = setInterval(capture, seconds * 1000);
  }
}
document.getElementById("inspect").onclick = inspectUpload;
document.getElementById("capture").onclick = capture;
document.getElementById("activate").onclick = activate;
document.getElementById("source-start").onclick = startSource;
document.getElementById("source-stop").onclick = stopSource;
document.getElementById("auto").onchange = autoChanged;
document.getElementById("review-pass").onclick = () => review("PASS");
document.getElementById("review-fail").onclick = () => review("FAIL");
document.getElementById("alarm").onclick = () => {
  audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
  alertEnabled = !alertEnabled;
  document.getElementById("alarm").textContent = alertEnabled ? "alert on" : "enable alert";
};
if (TOKEN) document.getElementById("export").href = "/export.csv?token=" + encodeURIComponent(TOKEN);
const socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws" + (TOKEN ? "?token=" + encodeURIComponent(TOKEN) : ""));
socket.onmessage = (event) => {
  const message = JSON.parse(event.data);
  if (message.type === "verdict") render(message.result);
  if (message.type === "advisory" && message.result.inspection_id === currentId) render(message.result);
};
socket.onclose = () => setTimeout(() => location.reload(), 2500);
setInterval(fetchMetrics, 5000);
fetchProfiles(); fetchMetrics(); fetchHistory();
</script>
</body>
</html>
