# SOP standard operating procedure cards for the VeriQC advisory engine.
#
# Definitive source of actions and causes for on-device recommendation generation.
# Every card carries hedged probable causes verified deterministically before release.

cards:
  - id: A01
    defect_class: crazing
    summary: fine irregular cracking across the surface
    probable_causes:
      - excessive rolling reduction
      - thermal stress during cooling
    immediate_actions:
      - check the rolling mill reduction schedule for this batch
      - flag the batch for metallurgy review
    escalation: if crazing appears on more than one part in the batch, escalate to the process engineer
    severity_scope: [minor, major, critical]

  - id: A02
    defect_class: inclusion
    summary: embedded foreign material inside the steel
    probable_causes:
      - carry-over from the caster
      - incomplete deoxidation
    immediate_actions:
      - record the position of the inclusion on the part
      - divert the batch to metallurgy for inclusion analysis
    escalation: if inclusions cluster in one area of the coil, stop the line
    severity_scope: [major, critical]

  - id: A03
    defect_class: patches
    summary: irregular surface patches with a sharp boundary
    probable_causes:
      - localized scale adherence during rolling
      - roll surface damage transferring to the strip
    immediate_actions:
      - inspect the roll surface for the matching imprint
      - clean the roll and re-check the next part
    escalation: if the same patch shape repeats on consecutive parts, escalate to the rolling mill
    severity_scope: [minor, major]

  - id: A04
    defect_class: pitted_surface
    summary: dense small pits across the surface
    probable_causes:
      - pickling attack on an incompletely scaled surface
      - water droplet etching during cooling
    immediate_actions:
      - check the pickling bath temperature and concentration
      - dry the strip before the next rolling pass
    escalation: if pitting appears on every part, stop and check the pickling line
    severity_scope: [minor, major, critical]

  - id: A05
    defect_class: rolled-in_scale
    summary: scale pressed into the surface during rolling
    probable_causes:
      - insufficient descaling before rolling
      - high mill temperature
    immediate_actions:
      - check the descaling water pressure and delay
      - reduce the rolling temperature for the next pass
    escalation: if scale severity increases across the coil, escalate to the mill supervisor
    severity_scope: [minor, major, critical]

  - id: A06
    defect_class: scratches
    summary: linear marks in the rolling direction
    probable_causes:
      - handling contact during transport
      - guide rail misalignment
      - scale particles trapped under the roller
    immediate_actions:
      - inspect the guide rail and adjust alignment
      - check the roller surface for trapped scale
    escalation: if scratches reappear after adjustment, escalate to the line supervisor
    severity_scope: [minor, major, critical]

  - id: A07
    defect_class: generic
    summary: anomaly that does not match any trained defect class
    probable_causes:
      - an unseen defect mode
      - a process excursion not covered by the trained classes
    immediate_actions:
      - quarantine the part for engineering review
      - photograph the region and attach it to the batch record
    escalation: if three unseen anomalies occur in one shift, escalate to the quality engineer
    severity_scope: [minor, major, critical]

  - id: A08
    defect_class: generic
    summary: image quality or alignment problem, not a part defect
    probable_causes:
      - camera or lens contamination
      - part not seated in the fixture
      - lighting changed since the last calibration
    immediate_actions:
      - re-image the part after checking the fixture and the lens
      - confirm the lighting matches the calibrated station
    escalation: if the quality flag repeats, recalibrate the station
    severity_scope: [minor, major, critical]

  - id: A09
    defect_class: generic
    summary: borderline finding that needs a human decision
    probable_causes:
      - the defect is close to the decision threshold
      - the defect class is one the detector is least reliable on
    immediate_actions:
      - re-image the part and inspect the marked region
      - record the operator decision so the threshold can be reviewed
    escalation: if borderline findings persist, review the calibration set
    severity_scope: [minor, major, critical]
