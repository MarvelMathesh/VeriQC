# VeriQC severity policy, version 1.
#
# Deterministic physical severity evaluation:
# Combines calibrated physical area (mm^2), class risk multiplier, zone criticality,
# and score margin to compute minor, major, or critical severity.
#
# mm_per_px is calibrated using an optical target reference fixture.
# The default configuration represents 1 pixel = 0.25 mm.

version: 1
mm_per_px: 0.25

# defect area in mm^2 at which a severity is reached
area_thresholds:
  minor: 1.0
  major: 10.0
  critical: 50.0

# multiplies the area thresholds for classes that are structurally worse
class_risk:
  scratches: 1.4
  inclusion: 1.5
  crazing: 1.2
  pitted_surface: 1.3
  patches: 1.0
  rolled-in_scale: 1.1

# multiplies the area thresholds for zones where a defect is less tolerable
zone_criticality:
  edge: 1.3
  corner: 1.4
  center: 1.0
  surface: 1.0

# escalate one step when the anomaly score is far above the fail threshold
score_margin:
  critical_margin: 0.5
