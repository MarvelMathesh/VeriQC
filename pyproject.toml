[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veriqc"
version = "1.0.0"
description = "Empirically calibrated edge inspection with a verified on-device Llama advisory"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "VeriQC contributors" }]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "Pillow>=10.0",
    "PyYAML>=6.0",
    "opencv-python>=4.10",
    "onnxruntime>=1.20",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "websockets>=13.0",
]

[project.optional-dependencies]
advisory = ["executorch>=1.6.0", "transformers>=4.45"]
train = [
    "torch>=2.4",
    "torchvision>=0.19",
    "ultralytics>=8.4",
]
research = [
    "pytest>=8.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "psutil>=6.0",
]

[tool.setuptools.packages.find]
include = ["veriqc*"]
exclude = ["tests*", "scripts*", "experiments*"]

[tool.setuptools.package-data]
veriqc = ["station/dashboard.html"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: needs a model artefact or a long measurement",
]
